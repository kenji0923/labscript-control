[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labscript-control"
version = "0.1.0"
description = "Local and SSH control of BLACS and Runmanager through a CLI and MCP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "labscript-control contributors"}]
keywords = ["labscript", "blacs", "runmanager", "mcp", "laboratory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
test = ["pytest>=8.3,<10", "mcp==1.30.0"]

[project.scripts]
labctl = "labcontrol.cli:entrypoint"
labcontrol-mcp = "labcontrol.mcp_server:main"
labcontrol-install-windows = "labcontrol.install_windows:main"

[project.urls]
Repository = "https://github.com/kenji0923/labscript-control"
Issues = "https://github.com/kenji0923/labscript-control/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labcontrol = ["register_tasks.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
