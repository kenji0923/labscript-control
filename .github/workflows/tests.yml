name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]" build
      - run: python -m pytest -q
      - run: python -m build
      - run: labctl --help
      - run: labcontrol-mcp --help
      - name: Check packaged task registration script
        run: python -c "from importlib.resources import files; assert files('labcontrol').joinpath('register_tasks.ps1').is_file()"
